name: LinkedIn sync

# Pulls new LinkedIn posts into data/linkedin.json and redeploys the site.
#
#  • schedule            — every 3 hours, reads the feed in the LINKEDIN_FEED_URL
#                          repository variable (Settings → Secrets and variables → Actions → Variables).
#  • repository_dispatch — instant: Zapier / Make / IFTTT can POST a post here
#                          (event_type "linkedin_post", client_payload { url, text, image, date }).
#  • workflow_dispatch   — manual: Actions → LinkedIn sync → Run workflow (optionally paste a post).
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'LinkedIn post URL (optional)'
        required: false
      text:
        description: 'Post text (optional)'
        required: false
      image:
        description: 'Image URL (optional)'
        required: false
  repository_dispatch:
    types: [linkedin_post]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: linkedin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: run
        name: Fetch & merge posts
        env:
          FEED_URL: ${{ vars.LINKEDIN_FEED_URL }}
          PAYLOAD: ${{ toJSON(github.event.client_payload || github.event.inputs) }}
        run: node scripts/linkedin-sync.mjs
      - name: Commit
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/linkedin.json assets/uploads/linkedin
          git commit -m "Sync new LinkedIn posts"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
